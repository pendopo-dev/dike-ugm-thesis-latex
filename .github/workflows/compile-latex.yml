name: Compile LaTeX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-class:
    name: Check class file copies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare class file copies
        run: make check-cls

  compile-proposal:
    name: Compile proposal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile proposal with Docker
        run: make proposal-docker

      - name: Upload proposal PDF
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: template/proposal/main.pdf
          retention-days: 90

  compile-skripsi:
    name: Compile thesis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile thesis with Docker
        run: make skripsi-docker

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v4
        with:
          name: skripsi-pdf
          path: template/skripsi/main.pdf
          retention-days: 90

  release:
    name: Attach PDFs to release
    runs-on: ubuntu-latest
    needs: [check-class, compile-proposal, compile-skripsi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download proposal PDF
        uses: actions/download-artifact@v4
        with:
          name: proposal-pdf
          path: ./pdfs/proposal

      - name: Download thesis PDF
        uses: actions/download-artifact@v4
        with:
          name: skripsi-pdf
          path: ./pdfs/skripsi

      - name: Prepare release assets
        run: |
          mv ./pdfs/proposal/main.pdf ./pdfs/proposal/proposal.pdf
          mv ./pdfs/skripsi/main.pdf ./pdfs/skripsi/thesis.pdf

      - name: Attach PDFs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./pdfs/proposal/proposal.pdf
            ./pdfs/skripsi/thesis.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
